[package]
name = "beautysaloon-tauri"
version = "0.1.0"
description = "BeautySaloon Tauri foundation"
authors = ["BeautySaloon"]
edition = "2021"

[lib]
name = "beautysaloon_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
chrono = { version = "0.4.41", default-features = false, features = ["clock", "serde"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
tauri = { version = "2.8.5", features = [] }
thiserror = "2.0.14"

[dev-dependencies]
tempfile = "3.20.0"

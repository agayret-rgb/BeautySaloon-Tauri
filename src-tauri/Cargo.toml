[package]
name = "beautysaloon-tauri"
version = "0.1.0"
description = "BeautySaloon Tauri foundation"
authors = ["BeautySaloon"]
edition = "2021"

[lib]
name = "beautysaloon_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "beautysaloon-tauri"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
chrono = { version = "=0.4.41", default-features = false, features = ["clock", "serde"] }
base64 = "=0.22.1"
reqwest = "=0.13.4"
rusqlite = { version = "=0.32.1", features = ["bundled"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.143"
sha2 = "=0.10.9"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "2"
thiserror = "=2.0.14"
url = "=2.5.8"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "=3.20.0"
